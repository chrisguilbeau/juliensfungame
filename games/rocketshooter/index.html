<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketshooter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            color: white;
        }
        
        #gameContainer {
            position: relative;
            border: 1px solid #333;
        }
        
        #gameCanvas {
            display: block;
            background: #000;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: #aaa;
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Position: <span id="positionDisplay">0, 0</span></div>
            <div>Velocity: <span id="velocityDisplay">0, 0</span></div>
            <div>Rotation: <span id="rotationDisplay">0°</span></div>
            <div>PowerUps: <span id="powerUpDisplay">None</span></div>
        </div>
        <div id="controls">
            Arrow Keys: Rotate | Up Arrow: Thrust | Space: Shoot | R: Reset
        </div>
    </div>
    
    <script src="vector.js"></script>
    <script src="ship.js"></script>
    <script src="projectile.js"></script>
    <script src="powerup.js"></script>
    <script src="enemy.js"></script>
    <script src="explosion.js"></script>
    <script src="starfield.js"></script>
    <script src="renderer.js"></script>
    <script src="game.js"></script>
</body>
</html>
