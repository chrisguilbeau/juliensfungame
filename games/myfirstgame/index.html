<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First 3D Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        #healthBarContainer {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            height: 40px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 5px;
        }
        
        #healthBar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000 0%, #ffff00 50%, #00ff00 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            position: relative;
        }
        
        #healthText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 2px 2px 4px #000;
            z-index: 101;
        }
        
        #gameStats {
            position: absolute;
            top: 80px;
            right: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="instructions">
            <h3>Controls:</h3>
            <p>WASD - Move around</p>
            <p>Mouse - Look around</p>
            <p>Space - Attack with sword</p>
            <p>H - Spawn helper (max 10)</p>
        </div>
        
        <div id="healthBarContainer">
            <div id="healthBar"></div>
            <div id="healthText">100 / 100</div>
        </div>
        
        <div id="gameStats">
            <div>Score: <span id="scoreValue">0</span></div>
            <div>Enemies: <span id="enemiesValue">0</span></div>
        </div>
    </div>
    
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="src/utils/Vector3Utils.js"></script>
    <script src="src/entities/Player.js"></script>
    <script src="src/entities/Enemy.js"></script>
    <script src="src/entities/CatEnemy.js"></script>
    <script src="src/entities/GiantEnemy.js"></script>
    <script src="src/entities/Helper.js"></script>
    <script src="src/entities/Cactus.js"></script>
    <script src="src/entities/Sword.js"></script>
    <script src="src/entities/DamageText.js"></script>
    <script src="src/systems/InputSystem.js"></script>
    <script src="src/systems/GameSystem.js"></script>
    <script src="src/Game.js"></script>
    <script src="src/index.js"></script>
</body>
</html>
